name: Bounded scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-semantics:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Whole bounded local scientific run
        shell: bash
        env:
          EVIDENCE: ${{ runner.temp }}/p086-scientific-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$EVIDENCE"
          set -o pipefail
          timeout --signal=TERM --kill-after=10s 240s bash -eu -o pipefail -c '
            ulimit -v 1048576
            ulimit -t 220
            python -B inspect_packet.py > "$EVIDENCE/packet.stdout" 2> "$EVIDENCE/packet.stderr"
            python -B -O inspect_packet.py > "$EVIDENCE/packet-optimized.stdout" 2> "$EVIDENCE/packet-optimized.stderr"
            python -B -m unittest discover -s tests -p "test_*.py" -v > "$EVIDENCE/tests.stdout" 2> "$EVIDENCE/tests.stderr"
            python -B src/scientific_checks.py --output-dir "$EVIDENCE/campaign" > "$EVIDENCE/campaign.stdout" 2> "$EVIDENCE/campaign.stderr"
          ' 2>&1 | tee "$EVIDENCE/whole-run.log"
      - name: Retain raw outputs even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p086-scientific-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p086-scientific-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
